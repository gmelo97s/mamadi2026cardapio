<!doctype html>
<!-- Gera a imagem estática da tampinha 3D (cap-poster): node scripts/render-poster.mjs (com o `npm run dev` rodando) -->
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      html, body { margin: 0; background: transparent; }
      canvas { display: block; width: 1100px; height: 1100px; }
    </style>
  </head>
  <body>
    <canvas id="c"></canvas>
    <script type="module">
      import "@fontsource/lilita-one/latin-400.css";
      import { createCapScene } from "/src/components/intro/capScene.ts";
      await document.fonts.load('68px "Lilita One"');
      createCapScene({
        canvas: document.getElementById("c"),
        texture: "/brand/cap-print.webp",
        centerY: 0.5,
        capPx: 960,
        hideOpener: true,
        still: true,
        onReady: () => setTimeout(() => (document.body.dataset.ready = "1"), 400),
      });
    </script>
  </body>
</html>
