<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Mamadi · Cardápio</title>
    <meta name="description" content="Cardápio do Bar Mamadi, em frente à Praça Roosevelt: litrão, copão, caipirinhas, Divas Pop e a comida caseira da Mamadi." />
    <meta name="theme-color" content="#0e0a08" />
    <script>
      try {
        document.documentElement.dataset.theme = localStorage.getItem("mamadi:tema") === "light" ? "light" : "dark";
      } catch (e) {
        document.documentElement.dataset.theme = "dark";
      }
      // abrindo pelo endereço normal, a primeira coisa na tela é a abertura (tampinha), nunca o cardápio
      if (!/^#\/(item|busca|cardapio|beber|comer)/.test(location.hash)) document.documentElement.classList.add("boot");
    </script>
    <style>
      /* tela de abertura desenhada antes do JavaScript: mesmo fundo, luz e tampinha da abertura */
      #boot {
        display: none;
      }
      html.boot,
      html.boot body {
        background: #0d0a08;
        overflow: hidden;
      }
      html.boot #boot {
        display: block;
        position: fixed;
        inset: 0;
        z-index: 200;
        overflow: hidden;
        background: #0d0a08;
      }
      #boot::before {
        content: "";
        position: absolute;
        left: 50%;
        top: 41%;
        width: 150vmin;
        height: 150vmin;
        transform: translate(-50%, -50%);
        background:
          radial-gradient(circle, rgba(250, 104, 18, 0.55) 0, rgba(250, 90, 10, 0.18) 28%, transparent 56%),
          radial-gradient(circle at 70% 30%, rgba(252, 0, 160, 0.12), transparent 50%);
      }
      #boot img {
        position: absolute;
        left: 50%;
        top: 41%;
        width: min(56vw, 27dvh, 290px);
        transform: translate(-50%, -50%);
        filter: drop-shadow(0 18px 30px rgba(0, 0, 0, 0.5));
      }
      @media (max-height: 739.98px) {
        #boot::before,
        #boot img {
          top: 36%;
        }
        #boot img {
          width: min(46vw, 21.5dvh, 250px);
        }
      }
    </style>
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Mamadi" />
    <link rel="icon" type="image/png" sizes="64x64" href="/brand/icon-64.png" />
    <link rel="apple-touch-icon" href="/brand/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Mamadi · Cardápio" />
    <meta property="og:description" content="Comida de mãe, drink de diva. Em frente à Praça Roosevelt." />
    <meta property="og:image" content="/brand/og.jpg" />
    <link rel="preload" href="/brand/cap-poster.webp" as="image" type="image/webp" />
  </head>
  <body>
    <div id="boot" aria-hidden="true"><img src="/brand/cap-poster.webp" alt="" /></div>
    <div id="root"></div>
    <noscript><style>#boot{display:none!important}html.boot,html.boot body{overflow:auto}</style>Ative o JavaScript para ver o cardápio do Mamadi.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
